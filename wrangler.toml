# Real domain / account / DB id / brand live in `.env` (gitignored) and are
# injected by `bun run deploy`, which renders these placeholders before calling
# wrangler. The committed values below are placeholders — see `.env.example`.
name = "agent-drop"
main = "src/index.ts"
compatibility_date = "2026-07-30"
account_id = "your-cloudflare-account-id"

# Workers Logs. Without this block nothing is retained, so a failed webhook or a
# thrown email handler leaves no trace once the tail disconnects.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*"]

[[routes]]
pattern = "example.com/*"
zone_name = "example.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agent-drop-storage"

[[d1_databases]]
binding = "DB"
database_name = "agent-drop-db"
database_id = "your-d1-database-id"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
queue = "agent-drop-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "agent-drop-webhooks"
max_retries = 50
max_batch_size = 5
max_batch_timeout = 10
retry_delay = 2

# Rate limiting. These counters are PER COLOCATION, not global -- each Cloudflare
# location keeps its own, so the effective ceiling is roughly
# (limit x colos reached). They throttle brute force and leaked-link abuse; they
# are not a hard quota and must not be described as one. `period` may only be 10
# or 60.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[vars]
DOMAIN = "example.com"
BRAND = "Agent Drop"
R2_ACCOUNT_ID = "your-cloudflare-account-id"
SES_REGION = "eu-central-1"
GOOGLE_CLIENT_ID_PUBLIC = "your-google-client-id"
