name = "agent-drop"
main = "src/index.ts"
compatibility_date = "2026-03-15"
account_id = "your-cloudflare-account-id"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker runs first for every request. Required so {box}.example.com subdomains
# (static hosting served from R2) reach the Worker instead of the apex SPA's
# index.html. Apex static assets fall through to env.ASSETS.fetch() one hop later.
run_worker_first = true

[[routes]]
pattern = "example.com/*"
zone_name = "example.com"

# Wildcard subdomain hosting: {box}.example.com/{site}/... (needs a proxied
# *.example.com DNS record; Universal SSL covers one wildcard level).
[[routes]]
pattern = "*.example.com/*"
zone_name = "example.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agent-drop-storage"

[[d1_databases]]
binding = "DB"
database_name = "agent-drop-db"
database_id = "your-d1-database-id"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
queue = "agent-drop-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "agent-drop-webhooks"
max_retries = 50
max_batch_size = 5
max_batch_timeout = 10
retry_delay = 2

[vars]
DOMAIN = "example.com"
SES_REGION = "eu-central-1"
GOOGLE_CLIENT_ID_PUBLIC = "your-google-client-id"
