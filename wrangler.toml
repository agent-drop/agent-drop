# Real domain / account / DB id / brand live in `.env` (gitignored) and are
# injected by `bun run deploy`, which renders these placeholders before calling
# wrangler. The committed values below are placeholders — see `.env.example`.
name = "agent-drop"
main = "src/index.ts"
compatibility_date = "2026-07-30"
account_id = "your-cloudflare-account-id"

# Workers Logs. Without this block nothing is retained, so a failed webhook or a
# thrown email handler leaves no trace once the tail disconnects.
[observability]
enabled = true
head_sampling_rate = 1

# `directory` is intentionally absent: the Cloudflare Vite plugin populates it in
# the Worker config it generates at build time, pointing at the client build
# output. Hardcoding it here would be stale at best and, since the build output
# now also holds the Worker bundle, would risk publishing it as a public asset.
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*", "/h/*"]

# `zone_name` is the ZONE, `pattern` carries the Worker host. Identical here
# because the default is a single apex; ZONE_NAME in `.env` separates them.
[[routes]]
pattern = "example.com/*"
zone_name = "example.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agent-drop-storage"

[[d1_databases]]
binding = "DB"
database_name = "agent-drop-db"
database_id = "your-d1-database-id"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
queue = "agent-drop-webhooks"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "agent-drop-webhooks"
max_retries = 50
max_batch_size = 5
max_batch_timeout = 10
retry_delay = 2

# R2 event notifications. There is NO matching producer binding on purpose: the
# bucket is the producer, wired up out-of-band with
# `wrangler r2 bucket notification create` (see CLAUDE.md). This consumer flips a
# drop from `pending` to `completed` when its bytes actually land, so an upload
# no longer depends on the client coming back to confirm.
[[queues.consumers]]
queue = "agent-drop-r2-events"
max_retries = 10
max_batch_size = 10
max_batch_timeout = 5
retry_delay = 5

# Rate limiting. These counters are PER COLOCATION, not global -- each Cloudflare
# location keeps its own, so the effective ceiling is roughly
# (limit x colos reached). They throttle brute force and leaked-link abuse; they
# are not a hard quota and must not be described as one. `period` may only be 10
# or 60.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Burst shed on the public webhook receivers, keyed by receiver id. Generous on
# purpose: a provider replaying a backlog is normal traffic, and the real bound
# on a receiver is its `daily_cap` column, which is counted in D1 and cannot fail
# open the way this can.
[[ratelimits]]
name = "HOOK_RATE_LIMIT"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# Hourly reaper for drops stuck in `pending` (src/lib/reaper.ts). Offset off the
# hour so it does not queue behind everyone else's :00 cron.
[triggers]
crons = ["17 * * * *"]

[vars]
# DOMAIN is the HTTP host the Worker serves from; MAIL_DOMAIN is what
# {box}@... resolves to. Identical unless the Worker sits on a subdomain.
DOMAIN = "example.com"
MAIL_DOMAIN = "example.com"
# Disabled by default. Set an ISO-8601 cutoff only for a bounded migration from
# the old sender-bearing reply addresses; do not leave it enabled indefinitely.
RELAY_LEGACY_REPLY_UNTIL = ""
BRAND = "Agent Drop"
R2_ACCOUNT_ID = "your-cloudflare-account-id"
SES_REGION = "eu-central-1"
GOOGLE_CLIENT_ID_PUBLIC = "your-google-client-id"
